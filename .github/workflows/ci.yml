name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the built package under Node ESM
        run: |
          node --input-type=module -e "
            const api = await import('@openjung/core');
            const answers = Object.fromEntries(Array.from({ length: 32 }, (_, i) => [i + 1, 3]));
            const result = api.generateResult(answers);
            if (result.type !== 'ESFJ') throw new Error('unexpected neutral type ' + result.type);
            console.log('ok:', Object.keys(api).length, 'exports,', api.SUPPORTED_LOCALES.length, 'locales');
          "

      - name: Lint package exports
        run: npm run check:package
