name: Publish to npm

# Publishes the version in package.json when a GitHub release is published.
# The release tag must match the package version (v1.2.3 ↔ "version": "1.2.3").
# Bump the version with `npm version <patch|minor|major>` before tagging; see CONTRIBUTING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check that the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${{ github.event.release.tag_name }}" != "$expected" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package version $expected"
            exit 1
          fi

      # prepublishOnly runs clean, typecheck, format check, tests, build and publint.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
